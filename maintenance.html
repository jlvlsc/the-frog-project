<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance – The Frog Project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        frog: { DEFAULT: '#B4F02A', dark: '#8EBE1F', light: '#C9F458' },
                        bg: '#0F1319'
                    },
                    fontFamily: {
                        heading: ['"Space Grotesk"', 'sans-serif'],
                        body: ['"Inter"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body { font-family: 'Inter', sans-serif; background: #0F1319; }

        .bg-animated {
            position: fixed; inset: 0;
            background: linear-gradient(135deg, #0F1319 0%, #111827 25%, #0F1319 50%, #1a2233 75%, #0F1319 100%);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            z-index: 0;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bubbles { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
        .bubble {
            position: absolute; border-radius: 50%; opacity: 0;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .float-icons { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
        .float-icon {
            position: absolute; font-size: 1.5rem;
            color: rgba(180, 240, 42, 0.1);
            animation: drift linear infinite;
        }
        @keyframes drift {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            5% { opacity: 1; }
            95% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 6px rgba(180,240,42,0.3)); }
            50% { filter: drop-shadow(0 0 18px rgba(180,240,42,0.6)); }
        }
        .glow-pulse { animation: pulseGlow 2.5s ease-in-out infinite; }

        @keyframes frogBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .frog-bounce { animation: frogBounce 2s ease-in-out infinite; }

        .frog-eye { animation: blink 3.5s ease-in-out infinite; transform-origin: center; }
        @keyframes blink {
            0%, 92%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        @keyframes wrenchWiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(15deg); }
            75% { transform: rotate(-15deg); }
        }
        .wrench-wiggle { animation: wrenchWiggle 1.5s ease-in-out infinite; }

        @keyframes gearSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes wrenchSpin { from { transform: translateX(-50%) rotate(0deg); } to { transform: translateX(-50%) rotate(360deg); } }
        .gear-spin { animation: gearSpin 6s linear infinite; }
        .gear-spin-reverse { animation: gearSpin 8s linear infinite reverse; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-up { opacity: 0; animation: fadeUp 0.8s ease forwards; }
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }
    </style>
</head>
<body class="text-white">
    <div class="bg-animated"></div>
    <div class="bubbles" id="bubbles"></div>
    <div class="float-icons" id="floatIcons"></div>

    <div class="relative z-10 h-screen flex items-center justify-center px-6">
        <div class="text-center">
            <!-- Frog emoji + Wrench emoji -->
            <div class="fade-up mb-8">
                <div class="frog-bounce inline-block relative">
                    <span class="text-[120px] leading-none">🐸</span>
                    <span class="text-[60px] leading-none absolute left-1/2 -top-[18px]" style="animation: wrenchSpin 4s linear infinite;">🔧</span>
                </div>
            </div>

            <!-- Text -->
            <h1 class="font-heading text-3xl md:text-4xl font-bold mb-3 fade-up delay-1">
                The Frog Project is<br><span class="text-frog">Under Maintenance</span>
            </h1>
            <p class="text-gray-500 text-sm fade-up delay-2">We'll be back online by mid-October 2026.</p>
        </div>
    </div>

    <script>
        (function() {
            const b = document.getElementById('bubbles');
            for (let i = 0; i < 20; i++) {
                const el = document.createElement('div');
                el.className = 'bubble';
                const s = Math.random() * 5 + 2;
                el.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;background:rgba(180,240,42,${Math.random()*0.12+0.04});animation-duration:${Math.random()*15+10}s;animation-delay:${Math.random()*10}s`;
                b.appendChild(el);
            }
            const c = document.getElementById('floatIcons');
            const icons = ['ph-hammer','ph-wrench','ph-gear','ph-screwdriver','ph-ruler','ph-pencil-ruler','ph-compass','ph-hard-hat'];
            for (let i = 0; i < 12; i++) {
                const el = document.createElement('i');
                el.className = 'ph ' + icons[i % icons.length] + ' float-icon';
                el.style.cssText = `left:${Math.random()*90+5}%;font-size:${Math.random()+0.8}rem;animation-duration:${Math.random()*20+18}s;animation-delay:${Math.random()*15}s`;
                c.appendChild(el);
            }
        })();
    </script>
</body>
</html>
